<style>
:root{--sage:#84A98C;--sage-l:#E3EDE5;--sage-d:#3F5F49;--cream:#FCFBF9;--lav:#9B5DE5;--lav-l:#EFE6FB;--lav-d:#5B2E91;--blush:#E07A5F;--blush-l:#FBE7E1;--blush-d:#8F3E2A;--sky:#8FB8DE;--sky-l:#E4EFF8;--sky-d:#2F5F86;--ink:#34423A;--mut:#69746D;--line:#E9E4DA}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h2{font-size:17px;font-weight:600;margin:0 0 8px}
h3{font-size:14px;font-weight:600;margin:14px 0 6px;color:var(--mut)}
.top{position:sticky;top:0;z-index:20;background:rgba(252,251,249,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 14px 0}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:56px}
.brand{font-weight:600;color:var(--sage-d);font-size:17px;margin-right:auto;white-space:nowrap}
.tab{border:0;background:transparent;padding:10px 14px;border-radius:999px;color:var(--mut);font-weight:500;min-height:44px}
.tab.on{background:var(--sage-l);color:var(--sage-d)}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:999px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:18px}
.wrap{max-width:1100px;margin:0 auto;padding:12px 14px 90px}
.grid{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut);font-size:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;min-height:44px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--sage);border-color:var(--sage);color:#fff}
.btn.b{background:var(--blush);border-color:var(--blush);color:#fff}
.btn.l{background:var(--lav-l);border-color:var(--lav-l);color:var(--lav-d)}
.btn.s{min-height:36px;padding:6px 12px;font-size:14px}
.btn.on{background:var(--sage-l);border-color:var(--sage);color:var(--sage-d)}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.chip.on{background:var(--sage-l);border-color:var(--sage);color:var(--sage-d)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;border:0}
.k-med{background:var(--sage-l);color:var(--sage-d)}.k-teach{background:var(--lav-l);color:var(--lav-d)}.k-research{background:var(--sky-l);color:var(--sky-d)}.k-other{background:var(--blush-l);color:var(--blush-d)}
input[type=text],input[type=number],input[type=date],input[type=time],select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;min-height:44px;max-width:100%}
input[type=text]{width:100%}
.cb{width:44px;height:44px;flex:none;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.cb i{width:24px;height:24px;border-radius:8px;border:2px solid var(--sage);display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:15px;line-height:1}
.cb.on i{background:var(--sage)}
.cb.lv i{border-color:var(--lav)}.cb.lv.on i{background:var(--lav)}
.trow{display:flex;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding:2px 0}
.trow:first-of-type{border-top:0}
.ttl{flex:1;min-width:120px;padding:6px 4px;word-break:break-word}
.acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding-left:44px;width:100%;margin-bottom:6px}
.acts .btn{min-height:32px;padding:4px 10px;font-size:13px}
.empty{color:var(--mut);font-size:14px;padding:8px 2px}
.core{border-color:var(--sage);border-width:2px}
.bonus{background:#FAF8F3;border-style:dashed}
.scene-card{padding:0;overflow:hidden;position:relative}
.scene-card.danger::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px rgba(224,122,95,.0);animation:pulse 1.1s ease-in-out infinite;border-radius:16px}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 22px 2px rgba(224,122,95,.0)}50%{box-shadow:inset 0 0 34px 6px rgba(224,122,95,.45)}}
#sceneSvg svg{display:block;width:100%;height:auto;max-height:340px}
.sc-info{padding:12px 16px 14px}
.msg{font-size:17px;font-weight:600;color:var(--blush-d)}
.msg.ok{color:var(--sage-d)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.bar>div{height:100%;background:var(--sage);transition:width .5s}
.bar.dn>div{background:var(--blush)}
.stat{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:14px}
.tm{font-size:56px;font-weight:600;color:var(--sage-d);text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.tm.brk{color:var(--sky-d)}
.center{text-align:center}
.pomo{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0;border-top:1px solid var(--line)}
.pomo:first-child{border-top:0}
.now{border:2px solid var(--blush);background:var(--blush-l)}
.pill{background:var(--blush);color:#fff;font-size:12px;padding:2px 10px;border-radius:999px;font-weight:600}
.pr{display:flex;align-items:center;gap:8px;background:var(--lav-l);color:var(--lav-d);border-radius:14px;padding:4px 14px 4px 4px}
.pr.cur{outline:2px solid var(--lav)}
.pr .t{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.blk{border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px}
.blk.done{background:var(--sage-l);border-color:var(--sage)}
.night{display:flex;align-items:center;gap:10px;background:var(--sky-l);color:var(--sky-d);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:8px}
.field{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.field label{min-width:150px;font-size:14px;color:var(--mut)}
.field input[type=number]{width:84px}
.warn{background:var(--blush-l);color:var(--blush-d);border-radius:12px;padding:10px 14px;font-size:14px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(52,66,58,.38);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(12px,env(safe-area-inset-top)) 12px 40px}
.sheet[hidden]{display:none}
.sheet-in{background:var(--cream);border-radius:20px;max-width:560px;width:100%;padding:16px;display:flex;flex-direction:column;gap:12px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{border:3px solid var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.err{color:var(--blush-d);font-size:14px;margin-top:4px}
details>summary{cursor:pointer;font-weight:600;color:var(--mut);font-size:14px;padding:10px 0;min-height:44px;list-style:revert}
.hint{font-size:13px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){.scene-card.danger::after{animation:none}}
</style>
</head>

<script>
(function(){

var PR=['fajr','dhuhr','asr','maghrib','isha'];

var METHODS=[['auto','Automatic for my location'],['3','Muslim World League'],['5','Egyptian General Authority'],['4','Umm Al-Qura (Makkah)'],['2','ISNA (North America)'],['1','Karachi'],['8','Gulf region'],['9','Kuwait'],['10','Qatar'],['13','Turkey (Diyanet)'],['15','Moonsighting Committee'],['16','Dubai'],['17','Malaysia (JAKIM)'],['11','Singapore'],['12','France (UOIF)'],['21','Morocco'],['23','Jordan'],['0','Shia Ithna-Ashari']];

    tags:[{id:'t1',name:'OBGYN',kind:'med',u:t},{id:'t2',name:'Group A',kind:'teach',u:t},{id:'t3',name:'Group B',kind:'teach',u:t},{id:'t4',name:'Research paper 1',kind:'research',u:t}],

    ]};
}
var COLS=['tags','tasks','exams','pomos','days','blocks'];
var S=jget(K1,null)||defaults();
(function fix(){var d=defaults();for(var k in d){if(S[k]==null)S[k]=d[k]}S.settings.look=Object.assign({},d.settings.look,S.settings.look||{})})();
var L=jget(K2,null)||{};
L.timer=L.timer||{state:'idle',focus:25,brk:5};
L.pt=L.pt||{};L.ptM=L.ptM||{};L.fired=L.fired||{};
if(L.sound==null)L.sound=true;
var ui={page:'today',filter:'all',examEdit:false,editBlock:null,sheet:false,day:today(),backlog:false,earlier:false,err:''};
var swReg=null;

function live(c){return S[c].filter(function(x){return !x.del})}
function put(c,item){item.u=nowMs();var i=S[c].findIndex(function(x){return x.id===item.id});if(i<0)S[c].push(item);else S[c][i]=item;changed()}
function del(c,id){var i=S[c].findIndex(function(x){return x.id===id});if(i>=0){S[c][i]={id:id,del:true,u:nowMs()};changed()}}
function setSettings(p){S.settings=Object.assign({},S.settings,p,{u:nowMs()});changed()}
function changed(){jset(K1,S);scheduleSync()}
function saveL(){jset(K2,L)}
function tagOf(id){return S.tags.find(function(t){return t.id===id&&!t.del})}
function tagChip(id,attrs){var t=tagOf(id);if(!t)return '<span class="tag k-other" '+(attrs||'')+'>no tag</span>';return '<span class="tag k-'+t.kind+'" '+(attrs||'')+'>'+esc(t.name)+'</span>'}
function tagOptions(sel,withNone,noneLabel){return '<option value="">'+(noneLabel||'No tag')+'</option>'+live('tags').map(function(t){return '<option value="'+t.id+'"'+(t.id===sel?' selected':'')+'>'+esc(t.name)+'</option>'}).join('')}

function dayRec(k){return S.days.find(function(d){return d.id===k&&!d.del})||{id:k,prayers:{},blocks:{}}}
function tickDay(kind,key){var r=JSON.parse(JSON.stringify(dayRec(today())));r[kind][key]=!r[kind][key];put('days',r)}

function carryOver(){var td=today(),ch=false;S.tasks.forEach(function(t){if(!t.del&&!t.done&&t.tier!=='backlog'&&t.day&&t.day<td){t.day=td;t.u=nowMs();ch=true}});if(ch)changed()}
function open(tier){return live('tasks').filter(function(t){return !t.done&&t.tier===tier&&(ui.filter==='all'||t.tag===ui.filter)})}
function coreStats(){var td=today(),core=live('tasks').filter(function(t){return t.tier==='core'&&(t.done?t.doneDay===td:true)});return {total:core.length,done:core.filter(function(t){return t.done}).length}}
function pomosOn(k){return live('pomos').filter(function(p){return p.day===k})}
function showedUp(k){return pomosOn(k).some(function(p){return p.complete})||live('tasks').some(function(t){return t.done&&t.tier==='core'&&t.doneDay===k})}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x}
function streak(){var run=0,gap=0,last14=0,i;for(i=0;i<14;i++){if(showedUp(dkOf(addDays(new Date(),-i))))last14++}
  for(i=0;i<400;i++){var k=dkOf(addDays(new Date(),-i));if(showedUp(k)){run++;gap=0}else{if(i===0)continue;gap++;if(gap>=2)break}}
  return {run:run,last14:last14}}
function combo(){var ps=pomosOn(today()).sort(function(a,b){return a.start-b.start}),c=0;for(var i=ps.length-1;i>=0;i--){if(ps[i].complete)c++;else break}return c}

function danger(){
  var n=new Date(),mins=n.getHours()*60+n.getMinutes();
  var tf=Math.min(1,Math.max(0,(mins-360)/1080));
  var timeRisk=0.2+0.8*Math.pow(tf,1.4);
  var cs=coreStats(),pomos=pomosOn(today()).filter(function(p){return p.complete}).length;
  var push=Math.min(0.3,pomos*0.06),r,safe=cs.total>0&&cs.done===cs.total;
  if(cs.total===0)r=Math.min(0.3,timeRisk*0.5);
  else r=Math.max(0.08,(1-cs.done/cs.total)*timeRisk-push);
  if(safe)r=0;
  var left=1440-mins;
  return {risk:r,safe:safe,total:cs.total,done:cs.done,left:left,pomos:pomos,fast:left<=180&&!safe}
}
function fmtLeft(m){return Math.floor(m/60)+'h '+pad(m%60)+'m'}

function fig(x,y,o){

  var K='stroke="#34423A" stroke-width="2.5" stroke-linecap="round" fill="none"';
  var OC='stroke="'+lk.outfit+'" stroke-width="3.6" stroke-linecap="round" fill="none"';
  var legs,arms,mouth;
  if(o.run){var d=(0.45*sp).toFixed(2);legs='<line x1="0" y1="-14" x2="-8" y2="0" '+K+'><animate attributeName="x2" values="-8;8;-8" dur="'+d+'s" repeatCount="indefinite"/></line><line x1="0" y1="-14" x2="8" y2="0" '+K+'><animate attributeName="x2" values="8;-8;8" dur="'+d+'s" repeatCount="indefinite"/></line>'}
  else legs='<line x1="0" y1="-14" x2="-6" y2="0" '+K+'/><line x1="0" y1="-14" x2="6" y2="0" '+K+'/>';
  if(m==='happy'){arms='<line x1="0" y1="-27" x2="-10" y2="-40" '+OC+'><animate attributeName="y2" values="-40;-34;-40" dur="0.8s" repeatCount="indefinite"/></line><line x1="0" y1="-27" x2="10" y2="-40" '+OC+'><animate attributeName="y2" values="-34;-40;-34" dur="0.8s" repeatCount="indefinite"/></line>';mouth='M-4 -36 Q0 -31 4 -36'}
  else if(m==='panic'){var d2=(0.35*sp).toFixed(2);arms='<line x1="0" y1="-27" x2="-10" y2="-38" '+OC+'><animate attributeName="y2" values="-38;-26;-38" dur="'+d2+'s" repeatCount="indefinite"/></line><line x1="0" y1="-27" x2="10" y2="-38" '+OC+'><animate attributeName="y2" values="-26;-38;-26" dur="'+d2+'s" repeatCount="indefinite"/></line>';mouth='M-3 -33 Q0 -38 3 -33'}
  else{arms='<line x1="0" y1="-27" x2="-10" y2="-19" '+OC+'/><line x1="0" y1="-27" x2="10" y2="-19" '+OC+'/>';mouth='M-3 -35 Q0 -33.5 3 -35'}
  var head;
  if(lk.hijab)head='<path d="M-11 -36 Q-12 -21 0 -21 Q12 -21 11 -36 Z" fill="'+lk.hair+'" stroke="#34423A" stroke-width="1.5"/><circle cy="-38" r="10.5" fill="'+lk.hair+'" stroke="#34423A" stroke-width="2"/><ellipse cy="-38" rx="6.8" ry="7.6" fill="'+lk.skin+'"/>';
  else head='<circle cy="-38" r="8" fill="'+lk.skin+'" stroke="#34423A" stroke-width="2.5"/><path d="M-8.5 -40 Q-8 -49.5 0 -49.5 Q8 -49.5 8.5 -40 Q4 -45 -3 -44.5 Q-7 -43.5 -8.5 -40Z" fill="'+lk.hair+'"/>';
  var face='<circle cx="-2.8" cy="-39.5" r="1.2" fill="#34423A"/><circle cx="2.8" cy="-39.5" r="1.2" fill="#34423A"/><path d="'+mouth+'" stroke="#34423A" stroke-width="1.5" stroke-linecap="round" fill="none"/>';
  if(lk.glasses)face+='<circle cx="-3.4" cy="-39.5" r="3" stroke="#34423A" stroke-width="1" fill="none"/><circle cx="3.4" cy="-39.5" r="3" stroke="#34423A" stroke-width="1" fill="none"/><line x1="-0.4" y1="-39.5" x2="0.4" y2="-39.5" stroke="#34423A" stroke-width="1"/>';
  return '<g transform="translate('+x+','+y+')">'+legs+'<line x1="0" y1="-30" x2="0" y2="-15" '+OC.replace('3.6','7')+'/>'+arms+head+face+'</g>';
}
function wave(n){var p='M-40 0';for(var i=0;i<n;i++)p+=' q10 -6 20 0 t20 0';return p}
function sunSvg(cx,cy){return '<g transform="translate('+cx+','+cy+')"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/><g stroke="#E9B949" stroke-width="3" stroke-linecap="round"><line x1="0" y1="-20" x2="0" y2="-28"/><line x1="0" y1="20" x2="0" y2="28"/><line x1="-20" y1="0" x2="-28" y2="0"/><line x1="20" y1="0" x2="28" y2="0"/><line x1="14" y1="14" x2="20" y2="20"/><line x1="-14" y1="-14" x2="-20" y2="-20"/><line x1="14" y1="-14" x2="20" y2="-20"/><line x1="-14" y1="14" x2="-20" y2="20"/></g></g><circle r="14" fill="#F6D36B"/></g>'}

    else boul='<g transform="translate('+bx.toFixed(1)+',100)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="'+((0.5+(1-risk)*1.5)*sp).toFixed(2)+'s" repeatCount="indefinite"/><circle r="22" fill="#B9B2A6"/><path d="M-10 -6 L6 4 M2 -14 L8 -4 M-14 8 L-4 14" stroke="#8E877B" stroke-width="2" fill="none"/></g></g>';
    inner='<rect width="200" height="150" fill="'+(safe?'#EFF6F0':'#F3EEE6')+'"/>'+(safe?sunSvg(165,28)+confetti():'')+'<rect y="122" width="200" height="28" fill="#D9E6DC"/>'+boul+fig(145,122,{m:m,run:!safe,sp:sp});
  }else{
    var c=[244,241,234],s=[139,150,163],col='rgb('+c.map(function(v,i){return Math.round(v+(s[i]-v)*risk)}).join(',')+')',rain='';

    var cloud='<g transform="translate(100,42) scale('+(0.9+0.3*risk).toFixed(2)+')" fill="'+col+'"><circle cx="-22" cy="4" r="14"/><circle cx="0" cy="-4" r="19"/><circle cx="22" cy="4" r="14"/><rect x="-36" y="4" width="72" height="14" rx="7"/></g>';
    var rb=safe?'<path d="M30 130 A70 70 0 0 1 170 130" stroke="#F0B8A8" stroke-width="5" fill="none"/><path d="M38 130 A62 62 0 0 1 162 130" stroke="#F6D36B" stroke-width="5" fill="none"/><path d="M46 130 A54 54 0 0 1 154 130" stroke="#A8D1B0" stroke-width="5" fill="none"/><path d="M54 130 A46 46 0 0 1 146 130" stroke="#A9C8E6" stroke-width="5" fill="none"/>':'';
    inner='<rect width="200" height="150" fill="'+(safe?'#E9F3FA':(risk>0.5?'#D5DDE4':'#E6EEF3'))+'"/><rect y="130" width="200" height="20" fill="#D9E6DC"/>'+rb+(safe?sunSvg(168,26)+confetti():cloud+rain)+fig(100,130,{m:m,sp:sp});
  }
  return open+inner+end;
}
function sceneMsg(D){
  if(D.total===0)return ['Add today’s core tasks to start the chase.',''];
  if(D.safe)return ['You saved me! Everything else today is a bonus.','ok'];
  if(D.risk<0.25)return ['I’m safe for now. Keep going.',''];
  if(D.risk<0.5)return ['Keep moving. Every focus session buys me time.',''];
  if(D.risk<0.75)return ['It’s getting close. One more core task!',''];
  return ['Run! Finish a core task to push the danger back.',''];
}

function mmss(ms){var s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+':'+pad(s%60)}
function timerRemain(){var T=L.timer;if(T.state==='paused')return T.remainMs;if(T.state==='focus'||T.state==='break')return Math.max(0,T.endTs-nowMs());return T.focus*60000}
function logPomo(complete){
  var T=L.timer,rem=timerRemain(),el=Math.round((T.focus*60000-rem)/60000);
  if(!complete&&el<1)return;
  put('pomos',{id:uid(),start:T.startTs||nowMs(),mins:complete?T.focus:el,planned:T.focus,complete:complete,tagId:T.tagId||null,blockId:T.blockId||null,day:dkOf(new Date(T.startTs||nowMs()))});
}
var wake=null;
function wakeOn(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(w){wake=w}).catch(function(){})}catch(e){}}
function wakeOff(){try{if(wake){wake.release();wake=null}}catch(e){}}
function timerStart(){var T=L.timer;T.state='focus';T.startTs=nowMs();T.endTs=nowMs()+T.focus*60000;saveL();wakeOn();render()}
function timerPause(){var T=L.timer;T.remainMs=Math.max(0,T.endTs-nowMs());T.was=T.state;T.state='paused';saveL();render()}
function timerResume(){var T=L.timer;T.state=T.was||'focus';T.endTs=nowMs()+T.remainMs;saveL();render()}
function timerStop(){var T=L.timer,wasFocus=(T.state==='focus'||(T.state==='paused'&&T.was==='focus'));if(wasFocus){logPomo(false);toast('Saved as an incomplete session. Still counts as effort.')}T.state='idle';T.blockId=null;saveL();wakeOff();render()}
function timerComplete(){var T=L.timer;
  if(T.state==='focus'){logPomo(true);beep();notify('Focus session done','Take your '+T.brk+' minute break. You pushed the danger back.','timer');T.state='break';T.endTs=nowMs()+T.brk*60000;T.startTs=null;saveL();toast('Focus complete. Break time.');render()}
  else{beep();notify('Break over','Ready for the next focus session?','timer');T.state='idle';saveL();wakeOff();render()}}
function timerTick(){var T=L.timer;if((T.state==='focus'||T.state==='break')&&nowMs()>=T.endTs){timerComplete();return}
  var el=$('#tmr');if(el){el.textContent=mmss(timerRemain());el.className='tm'+(T.state==='break'?' brk':'')}
  document.title=(T.state==='idle'?'Calm Study':mmss(timerRemain())+' · '+(T.state==='break'?'Break':'Focus'))}
var ac=null;
function beep(){if(!L.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[660,880,1040].forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);var t=ac.currentTime+i*0.22;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.start(t);o.stop(t+0.22)})}catch(e){}}

function ptSig(){return JSON.stringify([S.settings.loc,S.settings.method,S.settings.school])}
function timesFor(k){return L.pt[k]||SAMPLE}
function haveReal(){return !!L.pt[today()]}
function fetchMonth(y,m){
  var loc=S.settings.loc;if(!loc)return Promise.resolve(false);
  var sig=ptSig();if(L.ptSig!==sig){L.pt={};L.ptM={};L.ptSig=sig}
  var mk=y+'-'+pad(m);if(L.ptM[mk])return Promise.resolve(true);
  var q='school='+S.settings.school+(S.settings.method!=='auto'?'&method='+S.settings.method:'');
  var url=loc.lat!=null?'https://api.aladhan.com/v1/calendar/'+y+'/'+m+'?latitude='+loc.lat+'&longitude='+loc.lng+'&'+q:'https://api.aladhan.com/v1/calendarByCity/'+y+'/'+m+'?city='+encodeURIComponent(loc.city)+'&country='+encodeURIComponent(loc.country)+'&'+q;
  return fetch(url).then(function(r){return r.json()}).then(function(j){
    if(j.code!==200||!j.data)return false;
    j.data.forEach(function(d){var g=d.date.gregorian.date.split('-'),k=g[2]+'-'+g[1]+'-'+g[0],t=d.timings;
      L.pt[k]={fajr:t.Fajr.slice(0,5),sunrise:t.Sunrise.slice(0,5),dhuhr:t.Dhuhr.slice(0,5),asr:t.Asr.slice(0,5),maghrib:t.Maghrib.slice(0,5),isha:t.Isha.slice(0,5)}});
    L.ptM[mk]=true;saveL();return true}).catch(function(){return false});
}
function ensureTimes(months){
  var n=new Date(),list=[[n.getFullYear(),n.getMonth()+1]],nx=new Date(n.getFullYear(),n.getMonth()+1,1);
  if(months>1)list.push([nx.getFullYear(),nx.getMonth()+1]);
  return Promise.all(list.map(function(x){return fetchMonth(x[0],x[1])})).then(function(r){return r.every(Boolean)});
}

  var bl=live('blocks').sort(function(a,b){return a.order-b.order}),out=[];

    out.push({type:'prayer',key:p,m:M(t[p])});
    if(i<4&&bl[i]){var b=bl[i],st=M(t[p])+b.so,en=b.len>0?st+b.len:M(t[PR[i+1]])-b.eo;if(en<st+10)en=st+10;out.push({type:'block',b:b,start:st,end:en})}
  });
  out.push({type:'night',m:M(S.settings.bed)});
  return out;
}

function mergeCol(a,b){var m={};(a||[]).concat(b||[]).forEach(function(x){var o=m[x.id];if(!o||(x.u||0)>(o.u||0))m[x.id]=x});return Object.keys(m).map(function(k){return m[k]})}
function merge(a,b){var r=Object.assign({},a);COLS.forEach(function(c){r[c]=mergeCol(a[c],b[c])});r.settings=(b.settings&&(b.settings.u||0)>(a.settings.u||0))?b.settings:a.settings;return r}
var syncT=null,syncBusy=false;
function scheduleSync(){if(!SYNC.url||!L.syncCode)return;clearTimeout(syncT);syncT=setTimeout(function(){syncNow()},2500)}
function rpc(fn,args){return fetch(SYNC.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SYNC.key,Authorization:'Bearer '+SYNC.key,'Content-Type':'application/json'},body:JSON.stringify(args)}).then(function(r){if(!r.ok)throw new Error('sync '+r.status);return r.text()}).then(function(t){return t?JSON.parse(t):null})}
function syncNow(manual){
  if(!SYNC.url||!L.syncCode||syncBusy)return;syncBusy=true;
  rpc('sync_get',{p_code:L.syncCode}).then(function(rem){
    var before=JSON.stringify(S);
    if(rem&&rem.v){S=merge(S,rem);carryOver();jset(K1,S)}
    return rpc('sync_put',{p_code:L.syncCode,p_data:S}).then(function(){L.lastSync=nowMs();saveL();
      var st=$('#syncStat');if(st)st.textContent='Last synced '+new Date(L.lastSync).toLocaleTimeString();
      if(before!==JSON.stringify(S)&&!(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName))){render()}
      if(manual)toast('Synced')})
  }).catch(function(){var st=$('#syncStat');if(st)st.textContent='Couldn’t sync. Will retry.';if(manual)toast('Couldn’t sync. Check your connection.')}).then(function(){syncBusy=false});
}

function ics(dt,title,desc,mins){
  var s=dt.y+pad(dt.mo)+pad(dt.d)+'T'+pad(Math.floor(dt.m/60))+pad(dt.m%60)+'00';
  var e=dt.m+mins,es=dt.y+pad(dt.mo)+pad(dt.d)+'T'+pad(Math.floor(e/60)%24)+pad(e%60)+'00';
  return 'BEGIN:VEVENT\r\nUID:'+uid()+'@calmstudy\r\nDTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z\r\nDTSTART:'+s+'\r\nDTEND:'+es+'\r\nSUMMARY:'+title+'\r\nDESCRIPTION:'+desc+'\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:'+title+'\r\nTRIGGER:PT0M\r\nEND:VALARM\r\nEND:VEVENT\r\n';
}
function exportICS(){
  toast('Preparing…');
  ensureTimes(2).then(function(){
    var out='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//CalmStudy//EN\r\nCALSCALE:GREGORIAN\r\n';
    for(var i=0;i<14;i++){var d=addDays(new Date(),i),k=dkOf(d),meta={y:d.getFullYear(),mo:d.getMonth()+1,d:d.getDate()};
      plan(k).forEach(function(it){
        if(it.type==='prayer')out+=ics(Object.assign({m:it.m},meta),PRN[it.key]+' prayer','Time to pray.',15);
        else if(it.type==='block')out+=ics(Object.assign({m:it.start},meta),'Study: '+it.b.name,'Start your '+it.b.focus+'/'+it.b.brk+' timer.',Math.max(10,it.end-it.start));
      });
      out+=ics(Object.assign({m:21*60},meta),'3 hours to midnight','Check your core tasks. Save him before midnight.',10);
    }
    out+='END:VCALENDAR\r\n';
    var b=new Blob([out],{type:'text/calendar'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='calm-study-alarms.ics';document.body.appendChild(a);a.click();a.remove();
    toast(haveReal()?'Calendar file ready':'Calendar file ready (sample times; set your location first)');
  });
}

  bl.forEach(function(it){
    if(it.type==='prayer')ev.push({key:it.key,m:it.m,t:PRN[it.key]+' time',b:'Pause and pray. Your next study block starts soon.'});
    else if(it.type==='block')ev.push({key:it.b.id,m:it.start,t:'Study block: '+it.b.name,b:'Start your '+it.b.focus+'/'+it.b.brk+' timer.'});
  });
  if(cs.total===0)ev.push({key:'pick',m:9*60,t:'Choose today’s core tasks',b:'Pick what really matters today.'});
  if(left>0){ev.push({key:'n21',m:21*60,t:'3 hours to midnight',b:left+' core task'+(left>1?'s':'')+' left. You’ve got this.'});ev.push({key:'n23',m:23*60,t:'1 hour left',b:left+' core task'+(left>1?'s':'')+' left. Finish one more?'})}
  return ev;
}
function checkEvents(){
  if(!L.notif||!('Notification' in window)||Notification.permission!=='granted')return;
  var k=today(),nm=nowM();Object.keys(L.fired).forEach(function(x){if(x.slice(0,10)!==k)delete L.fired[x]});
  eventsToday().forEach(function(e){var id=k+':'+e.key;if(nm>=e.m&&nm<e.m+4&&!L.fired[id]){L.fired[id]=1;saveL();notify(e.t,e.b,e.key)}});
}

var tick=0;
function loop(){
  tick++;timerTick();
  if(today()!==ui.day){ui.day=today();carryOver();render();loadTimes(false)}
  if(tick%15===0){refreshScene();checkEvents();if(ui.page==='salah'&&!ui.editBlock&&!(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)))render()}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden){timerTick();carryOver();refreshScene();checkEvents();syncNow();if(ui.page==='salah'&&!ui.editBlock)render()}});

(function init(){
  carryOver();
  var T=L.timer;
  if((T.state==='focus'||T.state==='break')&&nowMs()>=T.endTs){if(T.state==='focus'){T.remainMs=0;logPomo(true)}T.state='idle';saveL()}
  render();
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').then(function(r){swReg=r}).catch(function(){})}
  loadTimes(false);syncNow();
  setInterval(loop,1000);
  setInterval(function(){syncNow()},90000);
})();
})();
</script>
