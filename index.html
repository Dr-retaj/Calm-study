function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x}
function streak(){var run=0,gap=0,last14=0,i;for(i=0;i<14;i++){if(showedUp(dkOf(addDays(new Date(),-i))))last14++}
  for(i=0;i<400;i++){var k=dkOf(addDays(new Date(),-i));if(showedUp(k)){run++;gap=0}else{if(i===0)continue;gap++;if(gap>=2)break}}
  return {run:run,last14:last14}}
function combo(){var ps=pomosOn(today()).sort(function(a,b){return a.start-b.start}),c=0;for(var i=ps.length-1;i>=0;i--){if(ps[i].complete)c++;else break}return c}

function danger(){
  var n=new Date(),mins=n.getHours()*60+n.getMinutes();
  var tf=Math.min(1,Math.max(0,(mins-360)/1080));
  var timeRisk=0.2+0.8*Math.pow(tf,1.4);
  var cs=coreStats(),pomos=pomosOn(today()).filter(function(p){return p.complete}).length;
  var push=Math.min(0.3,pomos*0.06),r,safe=cs.total>0&&cs.done===cs.total;
  if(cs.total===0)r=Math.min(0.3,timeRisk*0.5);
  else r=Math.max(0.08,(1-cs.done/cs.total)*timeRisk-push);
  var rec0=dayRec(today()),late=!safe&&rec0.where==='home'&&!!rec0.startBy&&mins>toM(rec0.startBy)&&!sessionStarted();
  if(late)r=Math.min(1,r+0.12);
  if(safe)r=0;
  var left=1440-mins;
  return {risk:r,safe:safe,total:cs.total,done:cs.done,left:left,pomos:pomos,late:late,fast:left<=180&&!safe}
}

function sceneMsg(D){
  if(D.total===0)return ['Add today’s core tasks to start the chase.',''];
  if(D.safe)return ['You saved me! Everything else today is a bonus.','ok'];
  if(D.late)return ['Start a session. The danger grows while you wait.',''];
  if(D.risk<0.25)return ['I’m safe for now. Keep going.',''];
  if(D.risk<0.5)return ['Keep moving. Every focus session buys me time.',''];
  if(D.risk<0.75)return ['It’s getting close. One more core task!',''];
  return ['Run! Finish a core task to push the danger back.',''];
}

function mmss(ms){var s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+':'+pad(s%60)}
function timerRemain(){var T=L.timer;if(T.state==='paused')return T.remainMs;if(T.state==='focus'||T.state==='break')return Math.max(0,T.endTs-nowMs());return T.focus*60000}
function logPomo(complete){
  var T=L.timer,rem=timerRemain(),el=Math.round((T.focus*60000-rem)/60000);
  if(!complete&&el<1)return;
  put('pomos',{id:uid(),start:T.startTs||nowMs(),mins:complete?T.focus:el,planned:T.focus,complete:complete,tagId:T.tagId||null,blockId:T.blockId||null,day:dkOf(new Date(T.startTs||nowMs()))});
}
var wake=null;
function wakeOn(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(w){wake=w}).catch(function(){})}catch(e){}}

function timerStart(){var T=L.timer;T.state='focus';T.startTs=nowMs();T.endTs=nowMs()+T.focus*60000;saveL();wakeOn();render()}
function timerPause(){var T=L.timer;T.remainMs=Math.max(0,T.endTs-nowMs());T.was=T.state;T.state='paused';saveL();render()}
function timerResume(){var T=L.timer;T.state=T.was||'focus';T.endTs=nowMs()+T.remainMs;saveL();render()}
function timerStop(){var T=L.timer,wasFocus=(T.state==='focus'||(T.state==='paused'&&T.was==='focus'));if(wasFocus){logPomo(false);toast('Saved as an incomplete session. Still counts as effort.')}T.state='idle';T.blockId=null;saveL();wakeOff();render()}

  if(T.state==='focus'){logPomo(true);beep();notify('Focus session done','Take your '+T.brk+' minute break. You pushed the danger back.','timer');T.state='break';T.endTs=nowMs()+T.brk*60000;T.startTs=null;saveL();toast('Focus complete. Break time.');render();maybeAfterAdhkar()}
  else{beep();notify('Break over','Ready for the next focus session?','timer');T.state='idle';saveL();wakeOff();render()}}

function ptSig(){return JSON.stringify([S.settings.loc,S.settings.method,S.settings.school])}
function timesFor(k){return L.pt[k]||SAMPLE}

function fetchMonth(y,m){
  var loc=S.settings.loc;if(!loc)return Promise.resolve(false);
  var sig=ptSig();if(L.ptSig!==sig){L.pt={};L.ptM={};L.ptSig=sig}
  var mk=y+'-'+pad(m);if(L.ptM[mk])return Promise.resolve(true);
  var q='school='+S.settings.school+(S.settings.method!=='auto'?'&method='+S.settings.method:'');
  var url=loc.lat!=null?'https://api.aladhan.com/v1/calendar/'+y+'/'+m+'?latitude='+loc.lat+'&longitude='+loc.lng+'&'+q:'https://api.aladhan.com/v1/calendarByCity/'+y+'/'+m+'?city='+encodeURIComponent(loc.city)+'&country='+encodeURIComponent(loc.country)+'&'+q;
  return fetch(url).then(function(r){return r.json()}).then(function(j){
    if(j.code!==200||!j.data)return false;
    j.data.forEach(function(d){var g=d.date.gregorian.date.split('-'),k=g[2]+'-'+g[1]+'-'+g[0],t=d.timings;
      L.pt[k]={fajr:t.Fajr.slice(0,5),sunrise:t.Sunrise.slice(0,5),dhuhr:t.Dhuhr.slice(0,5),asr:t.Asr.slice(0,5),maghrib:t.Maghrib.slice(0,5),isha:t.Isha.slice(0,5)}});
    L.ptM[mk]=true;saveL();return true}).catch(function(){return false});
}
function ensureTimes(months){
  var n=new Date(),list=[[n.getFullYear(),n.getMonth()+1]],nx=new Date(n.getFullYear(),n.getMonth()+1,1);
  if(months>1)list.push([nx.getFullYear(),nx.getMonth()+1]);
  return Promise.all(list.map(function(x){return fetchMonth(x[0],x[1])})).then(function(r){return r.every(Boolean)});
}

  if(!SYNC.url)return '<div class="card">Friends needs the online service, which isn’t set up.</div>';
  var lg=S.settings.league;
  if(!lg)return '<div class="stack" style="max-width:560px;margin:0 auto"><div class="card"><h2>Race your friends</h2><p class="mut" style="margin:0 0 10px">Everyone adds their tasks for the day, and a race shows who finishes first. Friends see only your progress and your character, never your task names.</p><div class="field"><label>Your name</label><input type="text" id="lgName" maxlength="24" placeholder="The name friends will see" style="flex:1;min-width:150px" value="'+esc(ui.lgName)+'"></div><button class="btn p" data-a="leagueCreate">Create a new league</button><h3>Or join your friends’ league</h3><div class="field"><input type="text" id="lgCode" maxlength="16" placeholder="League code" style="flex:1;min-width:150px;text-transform:uppercase"><button class="btn" data-a="leagueJoin">Join</button></div><div class="err" id="lgErr">'+esc(ui.lgErr)+'</div></div></div>';
  var head='<div class="card"><div class="row"><div style="flex:1"><h2 style="margin:0">Today’s race</h2><div class="mut">You are <b>'+esc(lg.name)+'</b> · League code <b style="letter-spacing:1px">'+esc(lg.code)+'</b></div></div><button class="btn s" data-a="copyLeague">Copy code</button><button class="btn s" data-a="leagueRefresh">Refresh</button></div></div>';
  if(!ui.board)return '<div class="stack" style="max-width:640px;margin:0 auto">'+head+'<div class="card"><div class="empty">'+(ui.boardErr||'Loading the race…')+'</div></div></div>';
  var list=boardMembers(),w=boardWins();
  var ranked=list.slice().sort(function(a,b){var pa=pctOf(a),pb=pctOf(b);if(pa!==pb)return pb-pa;var fa=a.today&&a.today.finished_at,fb=b.today&&b.today.finished_at;if(fa&&fb&&fa!==fb)return fa<fb?-1:1;if(fa&&!fb)return -1;if(!fa&&fb)return 1;return a.name<b.name?-1:1});
  var rk=ranked.map(function(m,i){var t=m.today,fin=t&&t.finished_at?' · finished '+new Date(t.finished_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';return '<div class="trow"><span style="width:28px;font-weight:600;color:var(--mut);padding-left:4px">'+(i+1)+'</span><span class="ttl"><b'+(m.me?' style="color:var(--lav-d)"':'')+'>'+esc(m.name)+'</b><div class="hint">'+(t&&t.total?t.done+' of '+t.total+' tasks'+fin:'No tasks added yet')+'</div></span><span class="tag k-'+(pctOf(m)>=100?'med':'other')+'" style="font-size:14px">'+pctOf(m)+'%</span></div>'}).join('');
  var wk=Object.keys(w).sort(function(a,b){return w[b]-w[a]}).map(function(n){return '<div class="trow"><span class="ttl">'+esc(n)+'</span><span class="tag k-teach">'+w[n]+' win'+(w[n]>1?'s':'')+'</span></div>'}).join('');
  return '<div class="stack" style="max-width:640px;margin:0 auto">'+head+'<div class="card" style="padding:10px">'+raceSvg(list)+(list.length<2?'<p class="hint" style="margin:8px 6px">You’re the only one here so far. Share the league code with your friends.</p>':'')+'</div><div class="card"><h2>Ranking</h2>'+rk+'</div><div class="card"><h2>Wins in the last 30 days</h2>'+(wk||'<div class="empty">No finished days yet.</div>')+'</div>'+(ui.boardErr?'<div class="warn">'+esc(ui.boardErr)+'</div>':'')+'<div class="row"><button class="btn s" data-a="leagueLeave">Leave league</button></div></div>';
}
function boardFetch(manual){
  var lg=S.settings.league;if(!SYNC.url||!lg||ui.boardBusy)return;ui.boardBusy=true;
  rpc('league_board',{p_league:lg.code,p_member:lg.member,p_days:30}).then(function(rows){ui.board=rows||[];ui.boardErr=''}).catch(function(){ui.boardErr='Couldn’t load the race. Will retry.'}).then(function(){ui.boardBusy=false;if(ui.page==='friends'&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)))render();if(manual&&!ui.boardErr)toast('Race updated')});
}
function leaguePush(){
  var lg=S.settings.league;if(!SYNC.url||!lg)return Promise.resolve();
  var cs=coreStats(),lk=S.settings.look;
  return rpc('league_put',{p_league:lg.code,p_member:lg.member,p_day:today(),p_name:lg.name,p_look:{skin:lk.skin,hair:lk.hair,outfit:lk.outfit,glasses:!!lk.glasses},p_total:cs.total,p_done:cs.done}).then(function(){if(ui.page==='friends')boardFetch()}).catch(function(){});
}
var lgT=null;
function scheduleLeague(){if(!SYNC.url||!S.settings.league)return;clearTimeout(lgT);lgT=setTimeout(leaguePush,2500)}
function leagueStart(){if(S.settings.league)leaguePush().then(function(){boardFetch()})}
function leagueJoin(create){
  var nm=(($('#lgName')||{}).value||'').trim(),er=$('#lgErr');ui.lgName=nm;
  function fail(m){ui.lgErr=m;if(er)er.textContent=m}
  if(!nm){fail('Type your name first.');return}
  var code=create?genCode(8):((($('#lgCode')||{}).value)||'').trim().toUpperCase();
  if(!create&&code.length<8){fail('Enter the league code your friend shared.');return}
  var member=uid()+uid(),cs=coreStats(),lk=S.settings.look;
  var p=create?rpc('league_create',{p_league:code}):Promise.resolve();
  p.then(function(){return rpc('league_put',{p_league:code,p_member:member,p_day:today(),p_name:nm,p_look:{skin:lk.skin,hair:lk.hair,outfit:lk.outfit,glasses:!!lk.glasses},p_total:cs.total,p_done:cs.done})})
   .then(function(){setSettings({league:{code:code,member:member,name:nm}});ui.lgErr='';ui.board=null;render();boardFetch();toast(create?'League created. Share the code with your friends.':'You joined the league.')})
   .catch(function(e){var m=String((e&&e.message)||'');fail(/not found/.test(m)?'That code wasn’t found. Check it and try again.':/name taken/.test(m)?'Someone in that league already uses that name.':/full/.test(m)?'That league is full (12 members).':'Couldn’t reach the service. Check your connection.')});
}

function mergeCol(a,b){var m={};(a||[]).concat(b||[]).forEach(function(x){var o=m[x.id];if(!o||(x.u||0)>(o.u||0))m[x.id]=x});return Object.keys(m).map(function(k){return m[k]})}
function merge(a,b){var r=Object.assign({},a);COLS.forEach(function(c){r[c]=mergeCol(a[c],b[c])});r.settings=(b.settings&&(b.settings.u||0)>(a.settings.u||0))?b.settings:a.settings;return r}
var syncT=null,syncBusy=false;
function scheduleSync(){if(!SYNC.url||!L.syncCode)return;clearTimeout(syncT);syncT=setTimeout(function(){syncNow()},2500)}
function rpc(fn,args){return fetch(SYNC.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SYNC.key,Authorization:'Bearer '+SYNC.key,'Content-Type':'application/json'},body:JSON.stringify(args)}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t||('sync '+r.status))});return r.text()}).then(function(t){return t?JSON.parse(t):null})}
function syncNow(manual){
  if(!SYNC.url||!L.syncCode||syncBusy)return;syncBusy=true;
  rpc('sync_get',{p_code:L.syncCode}).then(function(rem){
    var before=JSON.stringify(S);
    if(rem&&rem.v){S=merge(S,rem);carryOver();jset(K1,S);if(ui.whereOpen&&dayRec(today()).where){ui.whereOpen=false;closePop()}}
    return rpc('sync_put',{p_code:L.syncCode,p_data:S}).then(function(){L.lastSync=nowMs();saveL();
      var st=$('#syncStat');if(st)st.textContent='Last synced '+new Date(L.lastSync).toLocaleTimeString();
      if(before!==JSON.stringify(S)&&!(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName))){render()}
      if(manual)toast('Synced')})
  }).catch(function(){var st=$('#syncStat');if(st)st.textContent='Couldn’t sync. Will retry.';if(manual)toast('Couldn’t sync. Check your connection.')}).then(function(){syncBusy=false});
}

function ics(dt,title,desc,mins){
  var s=dt.y+pad(dt.mo)+pad(dt.d)+'T'+pad(Math.floor(dt.m/60))+pad(dt.m%60)+'00';
  var e=dt.m+mins,es=dt.y+pad(dt.mo)+pad(dt.d)+'T'+pad(Math.floor(e/60)%24)+pad(e%60)+'00';
  return 'BEGIN:VEVENT\r\nUID:'+uid()+'@calmstudy\r\nDTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z\r\nDTSTART:'+s+'\r\nDTEND:'+es+'\r\nSUMMARY:'+title+'\r\nDESCRIPTION:'+desc+'\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:'+title+'\r\nTRIGGER:PT0M\r\nEND:VALARM\r\nEND:VEVENT\r\n';
}
function exportICS(){
  toast('Preparing…');
  ensureTimes(2).then(function(){
    var out='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//CalmStudy//EN\r\nCALSCALE:GREGORIAN\r\n';
    for(var i=0;i<14;i++){var d=addDays(new Date(),i),k=dkOf(d),meta={y:d.getFullYear(),mo:d.getMonth()+1,d:d.getDate()};
      plan(k).forEach(function(it){
        if(it.type==='prayer')out+=ics(Object.assign({m:it.m},meta),PRN[it.key]+' prayer','Time to pray.',15);
      });
      live('reminders').forEach(function(r){if(r.type==='once'&&r.done)return;remTimes(r,k).forEach(function(m){out+=ics(Object.assign({m:m},meta),r.title,'Reminder',5)})});
      var nxd=addDays(d,1);out+=ics({y:nxd.getFullYear(),mo:nxd.getMonth()+1,d:nxd.getDate(),m:0},'Close your day','Say your night adhkar.',10);
      out+=ics(Object.assign({m:21*60},meta),'3 hours to midnight','Check your core tasks. Save him before midnight.',10);
    }
    out+='END:VCALENDAR\r\n';
    var b=new Blob([out],{type:'text/calendar'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='calm-study-alarms.ics';document.body.appendChild(a);a.click();a.remove();
    toast(haveReal()?'Calendar file ready':'Calendar file ready (sample times; set your location first)');
  });
}

function loadTimes(rerender){ensureTimes(2).then(function(ok){if(rerender){if(ok)toast('Prayer times updated');else if(S.settings.loc)toast('Couldn’t load prayer times. Check your connection.')}if(ui.sheet)renderSheet();render()})}

function eventsToday(){
  var k=today(),ev=[],bl=plan(k),cs=coreStats(),left=cs.total-cs.done;
  bl.forEach(function(it){
    if(it.type==='prayer')ev.push({key:it.key,m:it.m,t:PRN[it.key]+' time',b:'Pause and pray.'});
  });
  var rec=dayRec(k);
  if(rec.where==='home'&&rec.startBy&&!sessionStarted())ev.push({key:'startby',m:toM(rec.startBy),t:'Time to start your first session',b:'You planned to start by '+ft12(toM(rec.startBy))+'. One session is all it takes.'});
  live('reminders').forEach(function(r){if(r.type==='once'&&r.done)return;remTimes(r,k).forEach(function(m,i){if(r.type!=='once'&&((rec.rem&&rec.rem[r.id])||0)>i)return;ev.push({key:'r'+r.id+'_'+i,m:m,t:r.title,b:'Reminder'})})});
  if(cs.total===0)ev.push({key:'pick',m:9*60,t:'Choose today’s core tasks',b:'Pick what really matters today.'});
  if(left>0){ev.push({key:'n21',m:21*60,t:'3 hours to midnight',b:left+' core task'+(left>1?'s':'')+' left. You’ve got this.'});ev.push({key:'n23',m:23*60,t:'1 hour left',b:left+' core task'+(left>1?'s':'')+' left. Finish one more?'})}
  return ev;
}
function checkEvents(){
  if(!L.notif||!('Notification' in window)||Notification.permission!=='granted')return;
  var k=today(),nm=nowM();Object.keys(L.fired).forEach(function(x){if(x.slice(0,10)!==k)delete L.fired[x]});
  eventsToday().forEach(function(e){var id=k+':'+e.key;if(nm>=e.m&&nm<e.m+4&&!L.fired[id]){L.fired[id]=1;saveL();notify(e.t,e.b,e.key)}});
}

var tick=0;
function loop(){
  tick++;timerTick();
  if(today()!==ui.day){ui.day=today();carryOver();render();loadTimes(false);ensureWhere()}
  if(tick%60===0&&ui.page==='friends')boardFetch();
  if(tick%15===0){refreshScene();refreshWhere();checkEvents();checkNight();if(ui.page==='salah'&&!ui.editBlock&&!(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)))render()}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden){timerTick();carryOver();refreshScene();checkEvents();syncNow();if(ui.page==='salah'&&!ui.editBlock)render()}});

(function init(){
  carryOver();
  var T=L.timer;
  if((T.state==='focus'||T.state==='break')&&nowMs()>=T.endTs){if(T.state==='focus'){T.remainMs=0;logPomo(true)}T.state='idle';saveL()}
  render();
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').then(function(r){swReg=r}).catch(function(){})}
  loadTimes(false);syncNow();
  setTimeout(function(){ensureWhere();checkNight()},1500);leagueStart();
  setInterval(loop,1000);
  setInterval(function(){syncNow()},90000);
})();
})();
</script>
